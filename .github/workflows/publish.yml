name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Refresh instruction migration history
        run: node scripts/update-instruction-templates.js

      - name: Dry-run pack
        run: npm pack --dry-run

      # A new major waits under `next` until a person runs
      # `npm dist-tag add devlyn-cli@<version> latest`: apps install `devlyn-cli@latest`.
      - name: Publish to npm
        run: |
          latest="$(npm view devlyn-cli dist-tags.latest)"
          version="$(node -p "require('./package.json').version")"
          test -n "$latest" && test -n "$version"
          dist_tag=latest
          if [ "${version%%.*}" -gt "${latest%%.*}" ]; then dist_tag=next; fi
          npm publish --access public --tag "$dist_tag"
