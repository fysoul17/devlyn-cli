name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Refresh instruction migration history
        run: node scripts/update-instruction-templates.js

      - name: Dry-run pack
        run: npm pack --dry-run

      # The first release of a new major waits under `next`, because apps install
      # `devlyn-cli@latest`; the major's next release (or `npm dist-tag add`) promotes it.
      # Only `next` is ever named: npm refuses to move an implicit `latest` backwards.
      - name: Publish to npm
        run: |
          latest="$(npm view devlyn-cli dist-tags.latest)"
          version="$(node -p "require('./package.json').version")"
          [[ $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "npm latest is not a release version: '$latest'"; exit 1; }
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "package.json version is not semver: '$version'"; exit 1; }
          major="${version%%.*}"
          if [ "$major" -gt "${latest%%.*}" ] && [ -z "$(npm view "devlyn-cli@$major" version 2>/dev/null)" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
