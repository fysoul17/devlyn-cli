name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The release publishes the same tarball tested by the POSIX and native Windows suites.
  portability:
    uses: ./.github/workflows/portability.yml

  publish-npm:
    needs: portability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/portability/package

      - name: Verify tested npm artifact
        id: artifact
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tarfile
          package = pathlib.Path(os.environ['RUNNER_TEMP']) / 'portability/package'
          identity = json.loads((package / 'identity.json').read_text(encoding='utf-8'))
          assert identity['source_sha'] == os.environ['GITHUB_SHA'], 'Artifact source SHA mismatch'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['GITHUB_SHA'], 'Checkout source SHA mismatch'
          tarball, = package.glob('*.tgz')
          assert hashlib.sha256(tarball.read_bytes()).hexdigest() == identity['sha256'][tarball.name], 'Tarball SHA-256 mismatch'
          with tarfile.open(tarball, 'r:gz') as archive:
              packed = json.load(archive.extractfile('package/package.json'))
          checkout = json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))
          assert packed['version'] == checkout['version'], 'Tarball and checkout versions differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tarball={tarball}\n')

      # The first release of a new major waits under `next`, because apps install
      # `devlyn-cli@latest`; the major's next release (or `npm dist-tag add`) promotes it.
      # Only `next` is ever named: npm refuses to move an implicit `latest` backwards.
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          latest="$(npm view devlyn-cli dist-tags.latest)"
          version="$(node -p "require('./package.json').version")"
          [[ $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "npm latest is not a release version: '$latest'"; exit 1; }
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "package.json version is not semver: '$version'"; exit 1; }
          major="${version%%.*}"
          if [ "$major" -gt "${latest%%.*}" ] && [ -z "$(npm view "devlyn-cli@$major" version 2>/dev/null)" ]; then
            npm publish "$TARBALL" --access public --tag next
          else
            npm publish "$TARBALL" --access public
          fi
