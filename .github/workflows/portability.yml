name: Windows portability

on:
  # Runner minutes are billed, so this runs per release, not per PR (owner,
  # 2026-10-07): publish.yml calls it on the release tag and publishes only
  # after it passes. Before tagging a release, run this workflow by workflow_dispatch
  # on the release commit, and make the tag only after that run passes.
  # The harness suites run in a Linux container and on a hosted Mac (with the darwin helper self-tests);
  # Windows runs the activation and app contract suites and the app's status and cleanup count natively.
  # Before merging, run the POSIX half locally: npm ci &&
  # node scripts/update-cleanup-history.js && node scripts/update-instruction-templates.js &&
  # node scripts/update-skill-history.js &&
  # node --test scripts/test-installer-menu.cjs && bash scripts/lint-skills.sh &&
  # python3 scripts/test-ideate-loop.py && python3 scripts/test-storage-client.py &&
  # python3 scripts/test-harness-release.py && python3 scripts/test-harness-activation.py &&
  # python3 scripts/test-harness-run.py && python3 scripts/test-harness-cleanup.py &&
  # python3 scripts/test-harness-app-contract.py
  # (then restore the generated bin/*.json files)
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  posix:
    runs-on: ubuntu-latest
    # Root in a private PID namespace can observe every process used by cleanup tests.
    container:
      image: python:3.12-bookworm
      options: --init
    timeout-minutes: 20
    steps:
      - name: Trust the container checkout for this job
        shell: bash
        run: |
          printf 'GIT_CONFIG_COUNT=1\nGIT_CONFIG_KEY_0=safe.directory\nGIT_CONFIG_VALUE_0=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The tarball bundles the installer's menu dependencies from node_modules.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate offline manifests
        run: |
          node scripts/update-cleanup-history.js
          node scripts/update-instruction-templates.js
          node scripts/update-skill-history.js
      - name: Validate POSIX source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "POSIX source SHA: $GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/portability/logs"
          checks_failed=0
          node --test scripts/test-installer-menu.cjs 2>&1 | tee "$RUNNER_TEMP/portability/logs/installer-menu.log" || checks_failed=1
          bash scripts/lint-skills.sh 2>&1 | tee "$RUNNER_TEMP/portability/logs/lint.log" || checks_failed=1
          python3 scripts/test-ideate-loop.py 2>&1 | tee "$RUNNER_TEMP/portability/logs/ideate-loop.log" || checks_failed=1
          git diff --check 2>&1 | tee "$RUNNER_TEMP/portability/logs/diff.log" || checks_failed=1
          exit "$checks_failed"
      - name: Pack, identify and test npm artifact
        id: pack
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          def check_source():
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', '.',
                              ':(exclude)bin/instruction-templates.json',
                              ':(exclude)bin/skill-history.json',
                              ':(exclude)bin/cleanup-history.json'], check=True)
              subprocess.run(['git', 'diff', '--cached', '--exit-code', 'HEAD', '--'], check=True)
          check_source()
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'portability'
          package = root / 'package'
          driver = root / 'driver'
          package.mkdir(parents=True)
          driver.mkdir()
          # Its own prepack writes the release manifest and generated payload the package carries.
          result = subprocess.check_output(['npm', 'pack', '--json', '--pack-destination', str(package)])
          tarball = package / json.loads(result)[0]['filename']
          test = driver / 'test-windows-portability.py'
          shutil.copyfile('scripts/test-windows-portability.py', test)
          shutil.copyfile('scripts/test-ideate-loop.py', driver / 'test-ideate-loop.py')
          shutil.copyfile('scripts/test-storage-client.py', driver / 'test-storage-client.py')
          shutil.copytree('scripts/fixtures', driver / 'fixtures')
          check_source()
          driver_files = [test, driver / 'test-ideate-loop.py', driver / 'test-storage-client.py',
                          *sorted(p for p in (driver / 'fixtures').rglob('*') if p.is_file())]
          for copied in driver_files:
              source = 'scripts/' + copied.relative_to(driver).as_posix()
              assert copied.read_bytes() == subprocess.check_output([
                  'git', 'show', os.environ['GITHUB_SHA'] + ':' + source]), 'Copied driver differs from accepted source: ' + source
          identity = {'source_sha': os.environ['GITHUB_SHA'], 'sha256': {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (tarball, test)},
              'driver_sha256': {p.relative_to(driver).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in driver_files}}
          (package / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('source_bound=true\n')
          print('POSIX tested artifact: ' + json.dumps(identity), flush=True)
          installed = root / 'installed'
          subprocess.run(['npm', 'install', '--prefix', str(installed), '--cache', str(root / 'npm-cache'),
                          '--offline', '--ignore-scripts', '--no-audit', '--no-fund', str(tarball)], check=True)
          subprocess.run([sys.executable, str(test), '--package-root', str(installed / 'node_modules/devlyn-cli')], check=True)
          subprocess.run([sys.executable, 'scripts/test-storage-client.py', '--package-root', str(installed / 'node_modules/devlyn-cli')], check=True)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.pack.outputs.source_bound == 'true' }}
        with:
          name: npm-package
          path: ${{ runner.temp }}/portability/package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.pack.outputs.source_bound == 'true' }}
        with:
          name: portability-driver
          path: ${{ runner.temp }}/portability/driver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posix-evidence
          path: ${{ runner.temp }}/portability/logs/
          if-no-files-found: error

  harness:
    needs: posix
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Root in a private PID namespace can observe every process used by cleanup tests.
    container:
      image: python:3.12-bookworm
      options: --init
    # The five suites take about 5 minutes here (run 42753390614) and 11 to 17 on a Mac.
    timeout-minutes: 30
    steps:
      - name: Trust the container checkout for this job
        shell: bash
        run: |
          printf 'GIT_CONFIG_COUNT=1\nGIT_CONFIG_KEY_0=safe.directory\nGIT_CONFIG_VALUE_0=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # The suites run from a full checkout of the tested SHA: they read earlier commits and release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          set-safe-directory: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The cleanup suite installs from this checkout, with the manifests the package carries.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate offline manifests
        run: |
          node scripts/update-cleanup-history.js
          node scripts/update-instruction-templates.js
          node scripts/update-skill-history.js
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/harness/package
      - name: Harness suites on the tested release
        shell: python
        # The job runs as root and /root is private to it. /tmp is writable by every user and the runner's
        # folders belong to the runner's user: under either the run-folder tests skip.
        env:
          TMPDIR: /root
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'harness'
          identity = json.loads((root / 'package/identity.json').read_text(encoding='utf-8'))
          assert identity['source_sha'] == os.environ['GITHUB_SHA'], identity
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['GITHUB_SHA']
          tarball, = (root / 'package').glob('*.tgz')
          assert hashlib.sha256(tarball.read_bytes()).hexdigest() == identity['sha256'][tarball.name], tarball
          installed = root / 'installed'
          subprocess.run(['npm', 'install', '--prefix', str(installed), '--cache', str(root / 'npm-cache'),
                          '--offline', '--ignore-scripts', '--no-audit', '--no-fund', str(tarball)], check=True)
          # npm's .bin shims make the installed folder an install source, not a release: materialize it once,
          # as the app installs a release, and test that root.
          package = installed / 'node_modules/devlyn-cli'
          made = subprocess.run(['node', str(package / 'bin/devlyn.js'), 'release', '--materialize', '--source', str(package),
                                 '--store', str(root / 'store'), '--json'], stdout=subprocess.PIPE, check=True)
          release = json.loads(made.stdout.decode('utf-8').strip().splitlines()[-1])['data']['release']['root']
          print('Harness release root: ' + release, flush=True)
          failed = []
          for suite, args in (('release', ['--package-root', release]), ('activation', ['--package-root', release]),
                              ('run', ['--package-root', release]), ('cleanup', []),
                              ('app-contract', ['--package-root', release])):
              if subprocess.run([sys.executable, f'scripts/test-harness-{suite}.py', *args], stdin=subprocess.DEVNULL).returncode:
                  failed.append(suite)
          if failed:
              raise SystemExit('Harness suites failed: ' + ', '.join(failed))

  macos:
    needs: posix
    if: ${{ !cancelled() }}
    # The platform the run-folder channels were examined on, as the runner's own user on a
    # case-insensitive disk, and the darwin branches of the shipped helpers, which no other job runs.
    runs-on: macos-15
    # The step took 11 minutes on macos-15 (run 43664276936) and 1,185 to 1,471 s on a developer's Mac under load
    # (the task-complete self-test 798 s of the slower run).
    timeout-minutes: 45
    steps:
      # The suites run from a full checkout of the tested SHA: they read earlier commits and release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # `shell: python` needs python on PATH, and the suites need 3.11 or later, as in the container.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The cleanup suite installs from this checkout, with the manifests the package carries.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate offline manifests
        run: |
          node scripts/update-cleanup-history.js
          node scripts/update-instruction-templates.js
          node scripts/update-skill-history.js
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/harness/package
      - name: Darwin self-tests and harness suites on the tested release
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess, sys
          # In a temp folder others can write, such as /tmp, the run-folder tests skip: take the per-user one,
          # as the app's own macOS seed test does.
          os.environ['TMPDIR'] = subprocess.check_output(['getconf', 'DARWIN_USER_TEMP_DIR'], text=True).strip()
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'harness'
          identity = json.loads((root / 'package/identity.json').read_text(encoding='utf-8'))
          assert identity['source_sha'] == os.environ['GITHUB_SHA'], identity
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['GITHUB_SHA']
          tarball, = (root / 'package').glob('*.tgz')
          assert hashlib.sha256(tarball.read_bytes()).hexdigest() == identity['sha256'][tarball.name], tarball
          installed = root / 'installed'
          subprocess.run(['npm', 'install', '--prefix', str(installed), '--cache', str(root / 'npm-cache'),
                          '--offline', '--ignore-scripts', '--no-audit', '--no-fund', str(tarball)], check=True)
          package = installed / 'node_modules/devlyn-cli'
          made = subprocess.run(['node', str(package / 'bin/devlyn.js'), 'release', '--materialize', '--source', str(package),
                                 '--store', str(root / 'store'), '--json'], stdout=subprocess.PIPE, check=True)
          release = json.loads(made.stdout.decode('utf-8').strip().splitlines()[-1])['data']['release']['root']
          print('Harness release root: ' + release, flush=True)
          # A green leg has run what it is here for: the activation suite skips only the opt-in Codex probe, and
          # the cleanup suite skips nothing, its case-insensitive-disk tests included.
          skips = {'activation': 1, 'cleanup': 0}
          failed = []
          for label, args in (
                  # The darwin branches of the shipped helpers: proc_pidpath, the lsof writer scan, quarantine.
                  ('task-complete', [f'{release}/config/skills/_shared/task-complete.py', '--self-test']),
                  ('acceptance', [f'{release}/config/skills/devlyn-ideate/scripts/acceptance.py', '--self-test']),
                  ('release', ['scripts/test-harness-release.py', '--package-root', release]),
                  ('activation', ['scripts/test-harness-activation.py', '--package-root', release]),
                  ('run', ['scripts/test-harness-run.py', '--package-root', release]),
                  ('cleanup', ['scripts/test-harness-cleanup.py']),
                  ('app-contract', ['scripts/test-harness-app-contract.py', '--package-root', release])):
              child = subprocess.Popen([sys.executable, *args], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT)
              summary = b''
              for line in child.stdout:
                  sys.stdout.buffer.write(line)
                  sys.stdout.buffer.flush()
                  if re.match(rb'(OK|FAILED)\b', line):
                      summary = line
              skipped = int(re.search(rb'skipped=(\d+)', summary)[1]) if b'skipped=' in summary else 0
              if child.wait() or skipped != skips.get(label, skipped):
                  failed.append(f'{label} (skipped={skipped})')
          if failed:
              raise SystemExit('Harness checks failed: ' + ', '.join(failed))

  windows:
    needs: posix
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    # The checks' caps add up to 115 minutes (the 2700 s loop suite, the 900 s activation suite, three 480 s suites,
    # three 240 s self-tests, eight 120 s code-page counts and three 60 s probes), and the other count checks run after
    # them: the caps' sum plus margin for setup and those checks, to be tightened from the first run's measured time.
    timeout-minutes: 125
    steps:
      # The checkout is the test: Git for Windows refuses any tracked path Windows cannot
      # hold. The workspace root keeps the longest tracked path under MAX_PATH; the steps
      # below test the npm artifact from RUNNER_TEMP, outside the repository, and run only
      # the activation and app contract suites from this checkout at the tested SHA.
      - name: Check out every tracked path natively (fails on a Windows-illegal path)
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/portability/package
      - uses: actions/download-artifact@v4
        with:
          name: portability-driver
          path: ${{ runner.temp }}/portability/driver
      - name: Native install, real CLI smoke and full harness regressions
        shell: python
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '0'
        run: |
          import codecs, ctypes, hashlib, io, json, locale, os, pathlib, shutil, subprocess, sys, traceback
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'portability'
          logs = root / 'logs'
          logs.mkdir()
          identity = json.loads((root / 'package/identity.json').read_text(encoding='utf-8'))
          with io.TextIOWrapper(io.BytesIO()) as default_text:
              default_encoding = default_text.encoding
          # PowerShell writes count-in-use's process list in the console output code page: 0 means no console.
          observed = {'platform': sys.platform, 'python': sys.executable, 'utf8_mode': sys.flags.utf8_mode,
                      'locale': locale.getencoding(), 'default_textio': default_encoding,
                      'stdin': sys.stdin.encoding, 'stdout': sys.stdout.encoding, 'stderr': sys.stderr.encoding,
                      'windows_acp': ctypes.windll.kernel32.GetACP(),
                      'console_output_cp': ctypes.windll.kernel32.GetConsoleOutputCP(),
                      'oem_cp': ctypes.windll.kernel32.GetOEMCP(), **identity}
          (logs / 'identity.json').write_text(json.dumps(observed, indent=2) + '\n', encoding='utf-8')
          print('Native Windows tested artifact: ' + json.dumps(observed), flush=True)
          assert sys.platform == 'win32' and sys.flags.utf8_mode == 0, observed
          assert codecs.lookup(default_encoding).name != 'utf-8', observed
          assert identity['source_sha'] == os.environ['GITHUB_SHA'], identity
          tarball, = (root / 'package').glob('*.tgz')
          driver = root / 'driver/test-windows-portability.py'
          for path in (tarball, driver):
              assert hashlib.sha256(path.read_bytes()).hexdigest() == identity['sha256'][path.name], path
          for relative, expected in identity['driver_sha256'].items():
              assert hashlib.sha256((driver.parent / relative).read_bytes()).hexdigest() == expected, relative

          def checked(label, command, timeout=240, **kwargs):
              # No inherited stdin, and a bounded run: a hung check fails with its partial log instead of
              # consuming the job's timeout without evidence.
              with (logs / (label + '.log')).open('wb') as output:
                  try:
                      result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT,
                                              stdin=subprocess.DEVNULL, timeout=timeout, **kwargs)
                  except subprocess.TimeoutExpired:
                      output.write(f'\n[portability] {label} timed out after {timeout}s\n'.encode())
                      result = subprocess.CompletedProcess(command, 124)
              sys.stdout.buffer.write((logs / (label + '.log')).read_bytes())
              sys.stdout.buffer.flush()
              result.check_returncode()

          checked('node-version', ['node', '--version'])
          git_bash = pathlib.Path(shutil.which('git')).parent.parent / 'bin/bash.exe'
          assert git_bash.is_file(), git_bash
          os.environ['PATH'] = os.pathsep.join((str(git_bash.parent), os.environ['PATH']))
          if not shutil.which('python3'):
              raise RuntimeError('Native python3 route unavailable on PATH')
          checked('native-python3', ['python3', '-X', 'utf8=0', '-c',
                  'import locale,sys; print(sys.executable, sys.platform, sys.flags.utf8_mode, locale.getencoding(), flush=True); assert sys.platform == "win32" and sys.flags.utf8_mode == 0'])
          checked('git-bash', [str(git_bash), '--version'])
          # Recorded, and a refusal or a timeout is not raised here: the product's own Git Bash probe through this
          # bash, and what this bash says it is, raw, so one run shows the cause if `status` finds no Git Bash.
          # Output goes to files, not pipes: after a timeout a child the launcher left behind cannot hold the step.
          probes = {}
          for label, script in (('probe', 'echo "$BASH_VERSION"; cd / && pwd -W'),
                                ('system', 'uname -s; cat /proc/version; echo "MSYSTEM=$MSYSTEM OSTYPE=$OSTYPE"')):
              argv = [str(git_bash), '--norc', '-p', '-c', script]
              captured = [logs / f'git-bash-{label}.{stream}' for stream in ('out', 'err')]
              try:
                  with open(captured[0], 'wb') as out, open(captured[1], 'wb') as err:
                      answer = subprocess.run(argv, stdin=subprocess.DEVNULL, stdout=out, stderr=err, timeout=60)
                  probes[label] = {'argv': argv, 'exit': answer.returncode,
                                   'stdout': captured[0].read_bytes().decode('utf-8', 'backslashreplace'),
                                   'stderr': captured[1].read_bytes().decode('utf-8', 'backslashreplace')}
              except Exception as error:
                  probes[label] = {'argv': argv, 'error': repr(error)}
          observed['git_bash'] = probes
          (logs / 'identity.json').write_text(json.dumps(observed, indent=2) + '\n', encoding='utf-8')
          print('Native Windows Git Bash: ' + json.dumps(probes), flush=True)
          npm_cli = pathlib.Path(shutil.which('npm.cmd')).parent / 'node_modules/npm/bin/npm-cli.js'
          checked('npm-version', ['node', str(npm_cli), '--version'])
          installed = root / 'installed'
          checked('npm-install', ['node', str(npm_cli), 'install', '--prefix', str(installed),
                  '--cache', str(root / 'npm-cache'), '--offline', '--ignore-scripts', '--no-audit', '--no-fund', str(tarball)])
          package = installed / 'node_modules/devlyn-cli'

          # Exercise the real bin entrypoint; the driver's compiled installer fixture removes the CLI tail.
          project = root / 'cli-project'
          project.mkdir()
          agent_home = root / 'cli-agent-home'
          agent_home.mkdir()
          preload = root / 'homedir.cjs'
          preload.write_text("require('os').homedir = () => process.env.DEVLYN_TEST_HOME;\n", encoding='utf-8')
          child_env = dict(os.environ, DEVLYN_TEST_HOME=str(agent_home))
          checked('cli-entrypoint', ['node', '--require', str(preload), str(package / 'bin/devlyn.js'), '-y', '--claude'],
                  cwd=project, env=child_env)
          # Exactly the retained core skills: a retired skill is neither shipped nor installed.
          core = ['_shared', 'devlyn-engines', 'devlyn-ideate']
          assert sorted(p.name for p in (package / 'config/skills').iterdir()) == core
          shared = sorted(p.name for p in (package / 'config/skills/_shared').iterdir())
          for skills in (project / '.agents/skills', project / '.claude/skills'):
              marker = json.loads((skills / '.devlyn-install.json').read_text(encoding='utf-8'))
              assert marker['package'] == 'devlyn-cli', marker
              assert sorted(p.name for p in skills.iterdir() if p.name != '.devlyn-install.json') == core, skills
              assert sorted(p.name for p in (skills / '_shared').iterdir()) == shared, skills
              for skill in core[1:]:
                  assert f'name: {skill}\n' in (skills / skill / 'SKILL.md').read_text(encoding='utf-8'), skill
          print('Real CLI complete-install marker and retained skill set passed', flush=True)
          # As the app installs a release, and as the harness job tests it: plan and count from that root.
          checked('materialize', ['node', str(package / 'bin/devlyn.js'), 'release', '--materialize', '--source',
                  str(package), '--store', str(root / 'store'), '--json'])
          release = pathlib.Path(json.loads((logs / 'materialize.log').read_text(encoding='utf-8')
                                            .splitlines()[-1])['data']['release']['root'])
          # Two suites run from this checkout, which must be the tested SHA.
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          assert subprocess.check_output(['git', '-C', str(workspace), 'rev-parse', 'HEAD']).decode().strip() \
              == os.environ['GITHUB_SHA']

          failed = []
          for label, command, timeout in (
              # The package suite took 172-229 s of 240 and outlasted it once the package carried its release (4.3.2,
              # run 39813295135 attempt 2), so it got 480 s; its 181 tests took 180 and 185 s of that on 2026-11-15. The
              # Windows removal measurements add fixed pauses, up to three controls per holder and four 120 s fsmonitor
              # bounds, so it gets 900 s.
              ('portability', [sys.executable, '-X', 'utf8=0', str(driver), '--package-root', str(package)], 900),
              ('storage-client', [sys.executable, '-X', 'utf8=0', str(driver.parent / 'test-storage-client.py'),
                  '--package-root', str(package)], 480),
              # Every engine planned natively from the release, as the app plans each pane; 15 of 77 skip here.
              ('activation', [sys.executable, '-X', 'utf8=0', str(workspace / 'scripts/test-harness-activation.py'),
                  '--package-root', str(release)], 900),
              # What the app sends to a release and reads from its answers.
              ('app-contract', [sys.executable, '-X', 'utf8=0', str(workspace / 'scripts/test-harness-app-contract.py'),
                  '--package-root', str(release)], 480),
              ('engines-self-test', [sys.executable, '-X', 'utf8=0',
                  str(package / 'config/skills/_shared/role-config.py'), '--self-test'], 240),
              # Windows has no clone primitive here: allocation must skip warming before any lock or Cargo call.
              ('warm-build-dirs-self-test', [sys.executable, '-X', 'utf8=0',
                  str(package / 'config/skills/_shared/warm-build-dirs.py'), '--self-test'], 240),
              ('bring-in-self-test', [sys.executable, '-X', 'utf8=0',
                  str(package / 'config/skills/_shared/bring-in.py'), '--self-test'], 240),
              # The loop fixture creates real git worktrees per test; on native Windows it outlasted 240 s (run 37450856991),
              # and 71 tests took 594 s of 600 (run 38073614251); 108 tests took 1030-1104 s of 1200 (runs 38139167154,
              # 38146231685) and 109 outlasted it (run 38160732076), so the suite got 1800 s; 143 tests took 1293-1792 s of
              # it and outlasted it once (4.3.2, run 39813295135 attempt 1), so it gets 2700 s.
              ('ideate-loop', [sys.executable, '-X', 'utf8=0', str(driver.parent / 'test-ideate-loop.py'),
                  '--package-root', str(package)], 2700),
          ):
              try:
                  checked(label, command, timeout)
              except subprocess.CalledProcessError as error:
                  print(str(error), flush=True)
                  failed.append(label)

          # The app's calls on a Git project under a non-ASCII folder holding copies of the installed skills (proven
          # by content, so the copies stay proven): its status, and its count while a drain runs from one copy. A
          # process list that cannot be read keeps every copy; one that garbles the path keeps none.
          count = root / 'count 한글'
          count_env = dict(os.environ, USERPROFILE=str(agent_home), HOME=str(agent_home))

          def ask(label, *args):
              checked(label, ['node', str(release / 'bin/devlyn.js'), *args, '--json'], env=count_env)
              return json.loads((logs / (label + '.log')).read_text(encoding='utf-8').splitlines()[-1])

          def count_project():
              for name in ('.agents', '.claude'):
                  shutil.copytree(project / name, count / name)
              checked('count-git', ['git', 'init', '-q', str(count)])

          def status():
              answer = ask('status', 'status', '--project', str(count))
              assert answer['ok'], answer
              missing = [need for need in answer['data']['requirements'] if need['required'] and not need['available']]
              assert not missing, missing

          def count_in_use():
              # A drain runs its copy's scripts by absolute path.
              sleeper = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(300)',
                                          str(count / '.claude/skills/devlyn-ideate/scripts/queue.py')])
              try:
                  plan = ask('count', 'cleanup', '--plan', '--machine', '--project', str(count), '--checkout-only')
              finally:
                  sleeper.kill()
                  sleeper.wait()
              items = [item for scope in plan['data']['scopes'] if scope['kind'] == 'project' for item in scope['items']]
              copies = {name: [item for item in items if pathlib.Path(item['path']).parent.parts[-2:] == (name, 'skills')]
                        for name in ('.agents', '.claude')}
              for name, found in copies.items():
                  assert sorted(pathlib.Path(item['path']).name for item in found) == sorted(
                      [*core, '.devlyn-install.json']), (name, items)
              assert all(item['action'] == 'remove' and not item.get('reasons') for item in copies['.agents']), copies
              assert all(item['action'] == 'skip' and [reason['code'] for reason in item['reasons']] == ['in-use']
                         for item in copies['.claude']), copies

          # The same count in a console whose output code page is not UTF-8 (this image's is 65001): 437, and 949 when the
          # image accepts it; for the project's copies and for a machine's under a non-ASCII USERPROFILE; with a sleeper
          # naming the used copy with backslashes, then in Git Bash's spelling. PowerShell, which the product starts in
          # this console, writes in that code page. Beside it a control, printed and not asserted: 4.3.31's lister,
          # decoded as 4.3.31 did, at 437 while the same sleeper runs. And a second one, printed and not asserted: the
          # product's own lister call, its -Command text after a first statement that switches the session to
          # Constrained Language Mode, read by the product's own reader.
          kernel32 = ctypes.windll.kernel32
          machine_home = root / 'home 한글'
          control_lister = r'''
          const listing = require('child_process').spawnSync('powershell', ['-NoProfile', '-NonInteractive', '-Command',
            'Get-CimInstance Win32_Process | ForEach-Object { $_.CommandLine }'], { encoding: 'utf8', timeout: 20000 });
          const rows = listing.status === 0 ? listing.stdout.split(/\r?\n/).filter((line) => line && !line.includes(' cleanup --')) : null;
          console.log(rows === null ? 'lister failed' : rows.some((line) => line.includes(process.argv[1] + '\\')) ? 'yes' : 'no');
          '''

          # A recorded answer can hold any character (a path, an error), and this step's stdout may be in a legacy code
          # page that cannot encode it: it is printed in ASCII, each other character escaped.
          def print_ascii(text):
              print(text.encode('ascii', 'backslashreplace').decode('ascii'), flush=True)

          def control(used):
              try:
                  checked('control-437', ['node', '-e', control_lister, str(used)], 60)
                  answer = (logs / 'control-437.log').read_text(encoding='ascii').strip()
              except Exception as error:
                  answer = f'lister failed ({error})'
              print_ascii("control: 4.3.31's list at 437 holds the path: " + answer)

          constrained_lister = r'''
          const fs = require('fs'), path = require('path'), vm = require('vm'), crypto = require('crypto'), child = require('child_process');
          const source = fs.readFileSync(process.argv[1], 'utf8');
          const start = source.indexOf('\nconst CLEANUP_LIST_BYTES'), end = source.indexOf('\n// Markers are generated, not bundled');
          if (start < 0 || end < start) throw Error('the product has no process-list block');
          const context = vm.createContext({ path, Buffer, crypto, process, spawnSync: (command, args, options) => (context.listing =
            child.spawnSync(command, [...args.slice(0, -1), "$ExecutionContext.SessionState.LanguageMode = 'ConstrainedLanguage'; " + args.at(-1)], options)) });
          vm.runInContext(source.slice(start, end) + '\ncleanupInUse([]);', context);
          const { listing } = context, first = (bytes) => String(bytes || '').split(/\r?\n/).map((line) => line.trim()).find(Boolean) || 'no output';
          console.log(listing.error ? `failed (${listing.error.message})` : listing.status !== 0 ? `failed (${first(listing.stderr)})`
            : vm.runInContext('cleanupWindowsRows', context)(listing.stdout.toString('latin1')) ? 'yes' : 'no');
          '''

          def constrained():
              try:
                  checked('control-constrained', ['node', '-e', constrained_lister, str(release / 'bin/devlyn.js')], 60)
                  answer = (logs / 'control-constrained.log').read_text(encoding='utf-8', errors='replace').strip()
              except Exception as error:
                  answer = f'failed ({error})'
              print_ascii("control: the lister's command under ConstrainedLanguage reads rows: " + answer)

          def count_code_pages():
              for name in ('.agents', '.claude'):
                  shutil.copytree(project / name, machine_home / name)
              # The code page a new console gets on this image: a child given a console of its own reports it. Recorded,
              # not asserted: a runner that gives no such console fails no check.
              try:
                  checked('new-console-cp', [sys.executable, '-c', 'import ctypes; print(ctypes.windll.kernel32.GetConsoleOutputCP())'],
                          60, creationflags=subprocess.CREATE_NEW_CONSOLE)
                  answer = (logs / 'new-console-cp.log').read_text(encoding='ascii', errors='replace').strip()
              except Exception as error:
                  answer = f'failed ({error})'
              print_ascii('Native Windows new console output code page: ' + answer)
              original = kernel32.GetConsoleOutputCP()
              assert original, 'this step has no console whose code page could be set'
              scopes = (('project', count, ['--project', str(count)], count_env),
                        ('machine', machine_home, ['--machine'], dict(os.environ, USERPROFILE=str(machine_home), HOME=str(machine_home))))
              try:
                  for code_page in (437, 949):
                      if not kernel32.SetConsoleOutputCP(code_page):
                          assert code_page != 437, 'the console refused code page 437'
                          print(f'code page {code_page}: not accepted by this image', flush=True)
                          continue
                      assert kernel32.GetConsoleOutputCP() == code_page, code_page
                      for scope, home, args, env in scopes:
                          script = home / '.claude/skills/devlyn-ideate/scripts/queue.py'
                          for spelling, named in (('backslash', str(script)),
                                                  ('git-bash', '/' + script.drive[0].lower() + script.as_posix()[2:])):
                              label = f'count-{code_page}-{scope}-{spelling}'
                              sleeper = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(300)', named],
                                                         stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                              try:
                                  if (code_page, scope, spelling) == (437, 'project', 'backslash'):
                                      control(home / '.claude' / 'skills')
                                      constrained()
                                  checked(label, ['node', str(release / 'bin/devlyn.js'), 'cleanup', '--plan', *args, '--checkout-only',
                                                  '--json'], 120, env=env)
                              finally:
                                  sleeper.kill()
                                  sleeper.wait()
                              plan = json.loads((logs / (label + '.log')).read_text(encoding='utf-8').splitlines()[-1])
                              items = [item for found in plan['data']['scopes'] for item in found['items']]
                              for name, verdict in (('.claude', ('skip', ['in-use'])), ('.agents', ('remove', []))):
                                  copies = [item for item in items if pathlib.Path(item['path']).parent.parts[-2:] == (name, 'skills')]
                                  assert sorted(pathlib.Path(item['path']).name for item in copies) == sorted(
                                      [*core, '.devlyn-install.json']), (label, name, items)
                                  assert all((item['action'], [reason['code'] for reason in item.get('reasons', [])]) == verdict
                                             for item in copies), (label, name, copies)
                              print(f'{label}: the used copy is kept and the unused one offered', flush=True)
              finally:
                  kernel32.SetConsoleOutputCP(original)
                  assert kernel32.GetConsoleOutputCP() == original, 'the console output code page was not restored'

          for label, check in (('count-project', count_project), ('status', status), ('count-in-use', count_in_use),
                               ('count-code-pages', count_code_pages)):
              try:
                  check()
              except Exception:
                  traceback.print_exc()
                  failed.append(label)
          if failed:
              raise RuntimeError('Native checks failed: ' + ', '.join(failed))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: ${{ runner.temp }}/portability/logs/
          if-no-files-found: error
